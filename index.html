<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Gemini Ultra Glossy 3D</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0a0f1d 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      color: #fff;
    }

    /* =========================================
       1. GLOSSY 3D WELCOME CARD
       ========================================= */
    .glossy-card {
      position: relative;
      background: linear-gradient(180deg, #2b3952 0%, #172033 100%);
      border-radius: 26px;
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 
        0 8px 0 #0d1320,
        0 18px 30px rgba(0, 0, 0, 0.5),
        inset 0 1px 2px rgba(255, 255, 255, 0.6);
      overflow: hidden;
    }

    /* Glossy reflection on top of card */
    .glossy-card::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 6px;
      right: 6px;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0.03) 100%);
      border-radius: 22px 22px 50% 50% / 22px 22px 15% 15%;
      pointer-events: none;
    }

    .glossy-card h1 {
      font-size: 21px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4), 0 0 15px rgba(56, 189, 248, 0.6);
      margin-bottom: 5px;
    }
    .glossy-card p {
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 500;
    }

    /* =========================================
       2. ULTRA GLOSSY 3D BUTTONS
       ========================================= */
    .cat-container {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .glossy-btn {
      flex: 1;
      position: relative;
      padding: 13px 6px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      transition: all 0.1s ease;
      overflow: hidden;

      /* Default Inactive Glossy Blue-Grey */
      background: linear-gradient(180deg, #475569 0%, #1e293b 100%);
      box-shadow: 
        0 6px 0 #0f172a,
        0 10px 18px rgba(0, 0, 0, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.5);
    }

    /* Curved Glossy Sheen (Classic Bubble/Gel Glare) */
    .glossy-btn::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 3px;
      right: 3px;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.08) 100%);
      border-radius: 17px 17px 50% 50% / 17px 17px 20% 20%;
      pointer-events: none;
    }

    /* 3D Push Click Effect */
    .glossy-btn:active {
      transform: translateY(5px);
      box-shadow: 
        0 1px 0 #0f172a,
        0 4px 8px rgba(0, 0, 0, 0.4),
        inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    /* Active Highlight States */
    .glossy-btn.active {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      box-shadow: 
        0 6px 0 #0369a1,
        0 12px 22px rgba(2, 132, 199, 0.5),
        inset 0 1px 2px rgba(255, 255, 255, 0.9);
    }
    .glossy-btn.active:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #0369a1, 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    /* =========================================
       3. GLOSSY SUCCESS TOAST BADGE
       ========================================= */
    #toast {
      display: none;
      position: relative;
      background: linear-gradient(180deg, #10b981 0%, #047857 100%);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 5px 0 #064e3b,
        0 10px 20px rgba(16, 185, 129, 0.4),
        inset 0 1px 2px rgba(255, 255, 255, 0.8);
      overflow: hidden;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #toast::before {
      content: '';
      position: absolute;
      top: 1px;
      left: 5px;
      right: 5px;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.05) 100%);
      border-radius: 20px 20px 50% 50% / 20px 20px 20% 20%;
      pointer-events: none;
    }

    /* =========================================
       4. GLOSSY OUTPUT DISPLAY CONTAINER
       ========================================= */
    #output-box {
      flex: 1;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border-radius: 24px;
      padding: 16px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 14px;
      min-height: 240px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 
        0 6px 0 #0a0f1a,
        inset 0 2px 6px rgba(0, 0, 0, 0.6);
    }
    #output-box pre {
      background: #000000bb;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 12px;
      overflow-x: auto;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 13px;
    }
    #output-box img {
      width: 100%;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    /* =========================================
       5. GLOSSY 3D ACTION BUTTONS (ZIP & PREVIEW)
       ========================================= */
    .action-bar {
      display: none;
      gap: 10px;
      margin-bottom: 14px;
    }
    .action-btn {
      flex: 1;
      position: relative;
      padding: 12px;
      border-radius: 18px;
      font-weight: 800;
      font-size: 12px;
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      overflow: hidden;
      transition: all 0.1s ease;
    }
    .action-btn::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 3px;
      right: 3px;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.05) 100%);
      border-radius: 14px 14px 50% 50% / 14px 14px 20% 20%;
      pointer-events: none;
    }
    .preview-btn {
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      box-shadow: 0 5px 0 #047857, 0 10px 15px rgba(16, 185, 129, 0.4), inset 0 1px 1px #fff;
    }
    .preview-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #047857;
    }

    .zip-btn {
      background: linear-gradient(180deg, #f43f5e 0%, #e11d48 100%);
      box-shadow: 0 5px 0 #9f1239, 0 10px 15px rgba(244, 63, 94, 0.4), inset 0 1px 1px #fff;
    }
    .zip-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #9f1239;
    }

    /* =========================================
       6. GLOSSY INPUT BAR & SEND BUTTON
       ========================================= */
    .input-box {
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 14px 16px;
      border-radius: 20px;
      color: #fff;
      font-size: 14px;
      outline: none;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.5);
    }
    input::placeholder {
      color: #94a3b8;
    }

    .send-btn {
      position: relative;
      padding: 14px 22px;
      border-radius: 20px;
      background: linear-gradient(180deg, #6366f1 0%, #4338ca 100%);
      box-shadow: 0 5px 0 #312e81, 0 10px 20px rgba(99, 102, 241, 0.4), inset 0 1px 1px #fff;
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.1s ease;
    }
    .send-btn::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 3px;
      right: 3px;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.05) 100%);
      border-radius: 16px 16px 50% 50% / 16px 16px 20% 20%;
      pointer-events: none;
    }
    .send-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #312e81;
    }

    /* Modal */
    #preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      flex-direction: column;
    }
    #preview-modal header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: #111827;
      border-bottom: 1px solid #374151;
    }
    #preview-iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }

    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- English Welcome Header with Glossy 3D finish -->
  <div class="glossy-card">
    <h1>Welcome to Gemini Ultra Studio</h1>
    <p>Select your mode to generate code, photos, or chat</p>
  </div>

  <!-- Glossy 3D Categories -->
  <div class="cat-container">
    <button class="glossy-btn active" onclick="setCategory('coding', this)">💻 Coding</button>
    <button class="glossy-btn" onclick="setCategory('photo', this)">🎨 Photo</button>
    <button class="glossy-btn" onclick="setCategory('chat', this)">💬 Chat</button>
  </div>

  <!-- Glossy Success Toast Badge -->
  <div id="toast">✨ Mode activated successfully!</div>

  <!-- Output Box -->
  <div id="output-box">
    Hello! I am your AI assistant. Choose a category and tell me what you need!
  </div>

  <!-- 3D Action Buttons (Preview & ZIP) -->
  <div class="action-bar" id="actionBar">
    <button class="action-btn preview-btn" onclick="openPreview()">🌐 Live HTML Preview</button>
    <button class="action-btn zip-btn" onclick="sendZipToBot()">📦 Send ZIP to Bot Inbox</button>
  </div>

  <!-- Input Bar -->
  <div class="input-box">
    <input type="text" id="userInput" placeholder="Ask for code, images, questions..." />
    <button class="send-btn" onclick="submitPrompt()">SEND</button>
  </div>

  <!-- HTML Live Preview Modal -->
  <div id="preview-modal">
    <header>
      <span style="font-weight: 800; font-size: 15px;">🌐 Live Website Preview</span>
      <button class="glossy-btn" style="padding: 6px 16px; flex: none;" onclick="closePreview()">✕ Close</button>
    </header>
    <iframe id="preview-iframe"></iframe>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    let currentCategory = 'coding';
    let latestRawCode = "";

    function setCategory(cat, element) {
      currentCategory = cat;
      document.querySelectorAll('.glossy-btn').forEach(b => b.classList.remove('active'));
      element.classList.add('active');

      const toast = document.getElementById("toast");
      toast.style.display = "block";
      toast.innerText = `✨ ${cat.toUpperCase()} mode activated successfully!`;

      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      setTimeout(() => { toast.style.display = "none"; }, 2500);
    }

    async function submitPrompt() {
      const input = document.getElementById("userInput");
      const prompt = input.value.trim();
      if (!prompt) return;

      const output = document.getElementById("output-box");
      const actionBar = document.getElementById("actionBar");
      actionBar.style.display = "none";

      output.innerHTML = `<em>✨ Generating ${currentCategory.toUpperCase()}... Please wait...</em>`;
      input.value = "";

      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, category: currentCategory })
        });
        const data = await res.json();

        if (data.type === 'image') {
          output.innerHTML = `<img src="${data.result}" alt="Generated Photo" />`;
        } else {
          output.innerHTML = `<pre>${escapeHtml(data.result)}</pre>`;
          latestRawCode = extractHtmlCode(data.result);

          if (latestRawCode || currentCategory === 'coding') {
            actionBar.style.display = "flex";
          }
        }
      } catch (err) {
        output.innerText = "Error: " + err.message;
      }
    }

    function extractHtmlCode(text) {
      const match = text.match(/```html([\s\S]*?)```/i) || text.match(/```([\s\S]*?)```/i);
      return match ? match[1].trim() : text;
    }

    function openPreview() {
      if (!latestRawCode) return alert("No HTML code to preview!");
      const modal = document.getElementById("preview-modal");
      const iframe = document.getElementById("preview-iframe");
      modal.style.display = "flex";
      iframe.srcdoc = latestRawCode;
    }

    function closePreview() {
      document.getElementById("preview-modal").style.display = "none";
    }

    async function sendZipToBot() {
      const userId = tg?.initDataUnsafe?.user?.id;
      if (!userId) {
        alert("টেলিগ্রাম থেকে ওপেন করুন যাতে আপনার Chat ID পাওয়া যায়।");
        return;
      }

      alert("Creating ZIP and sending to your Telegram Bot Inbox...");

      try {
        const res = await fetch('/api/send-zip', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code: latestRawCode,
            chatId: userId
          })
        });
        const data = await res.json();
        if (data.success) {
          alert("✅ Success! Check your Telegram Bot Inbox for the ZIP file.");
        } else {
          alert("Failed: " + data.error);
        }
      } catch (err) {
        alert("Error sending ZIP: " + err.message);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
