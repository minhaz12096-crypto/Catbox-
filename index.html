<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Catbox File Uploader</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fredoka Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;900&display=swap" rel="stylesheet">

  <!-- TGS স্টিকার প্লে করার লাইব্রেরি -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>

  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    .title-3d {
      font-family: 'Fredoka', sans-serif;
      font-weight: 900;
      background: linear-gradient(180deg, #ffffff 15%, #38bdf8 50%, #0284c7 80%, #0369a1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-glossy-3d {
      font-family: 'Fredoka', sans-serif;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }

    .btn-glossy-3d::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 10%;
      right: 10%;
      height: 40%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.05) 100%);
      border-radius: 9999px;
      pointer-events: none;
    }

    .btn-glossy-3d:active {
      transform: translateY(2px);
    }

    .btn-cyan {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 60%, #0369a1 100%);
      box-shadow: 0 4px 0 #075985, 0 8px 12px rgba(2, 132, 199, 0.4);
      color: #ffffff;
    }

    .btn-emerald {
      background: linear-gradient(180deg, #34d399 0%, #059669 60%, #064e3b 100%);
      box-shadow: 0 4px 0 #064e3b, 0 8px 12px rgba(5, 150, 105, 0.4);
      color: #ffffff;
    }

    .progress-bar-glow {
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md bg-[#111827] border border-slate-800 rounded-3xl p-6 shadow-2xl relative text-center">
    
    <!-- হেডার -->
    <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-3xl shadow-lg">
      🐱
    </div>
    <h1 class="title-3d text-2xl uppercase tracking-wider mb-1">Catbox Uploader</h1>
    <p class="text-xs font-mono text-slate-400 mb-5">Upload Images, WebM & Telegram Stickers (.tgs)</p>

    <!-- আপলোড ড্রপজোন -->
    <div onclick="document.getElementById('fileInput').click()" 
         id="dropZone"
         class="border-2 border-dashed border-cyan-500/40 hover:border-cyan-400 bg-slate-900/60 rounded-2xl p-6 cursor-pointer transition-all active:scale-[0.98]">
      
      <input type="file" id="fileInput" class="hidden" onchange="handleFileSelect(event)" />
      
      <div class="text-4xl mb-2">📁</div>
      <p id="fileLabel" class="text-xs font-bold text-slate-200 uppercase font-mono tracking-wide">
        Click or Drag file here
      </p>
      <span id="fileSizeLabel" class="text-[10px] text-slate-500 font-mono mt-1 block">Max size: 4.5 MB</span>
    </div>

    <!-- অপশনাল Catbox Userhash -->
    <div class="mt-3 text-left">
      <input type="text" id="userHash" placeholder="Optional: Catbox Userhash" 
             class="w-full bg-[#070b14] border border-slate-800 rounded-xl px-3 py-2 text-[11px] font-mono text-slate-300 placeholder-slate-600 focus:outline-none focus:border-cyan-400" />
    </div>

    <!-- লাইভ প্রগ্রেস বার -->
    <div id="progressBox" class="hidden mt-4 w-full">
      <div class="flex justify-between text-xs font-mono text-slate-400 mb-1">
        <span id="uploadStatus">Uploading file...</span>
        <span id="uploadPercent">0%</span>
      </div>
      <div class="w-full h-2.5 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
        <div id="progressBar" class="h-full bg-gradient-to-r from-cyan-400 to-indigo-500 w-0 transition-all duration-100 progress-bar-glow"></div>
      </div>
    </div>

    <!-- আপলোড বাটন -->
    <button onclick="uploadToCatbox()" id="uploadBtn" 
            class="w-full mt-4 btn-glossy-3d btn-cyan py-3 rounded-xl font-bold text-xs uppercase tracking-wider">
      🚀 Upload & Get Link
    </button>

    <!-- রেজাল্ট বক্স -->
    <div id="resultBox" class="hidden mt-5 text-left bg-[#070b14] p-4 rounded-2xl border border-slate-800/90 shadow-inner">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[10px] font-mono text-emerald-400 uppercase font-bold flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Upload Successful!
        </span>
        <button onclick="copyLink()" id="copyBtn" class="btn-glossy-3d btn-emerald px-3 py-1 text-[11px] rounded-lg font-mono">
          Copy Link
        </button>
      </div>

      <!-- ডিরেক্ট লিংক ফিল্ড -->
      <input type="text" id="resultUrl" readonly 
             class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2 text-xs font-mono text-cyan-300 select-all focus:outline-none" />

      <!-- লাইভ প্রিভিউ -->
      <div id="previewArea" class="mt-3 flex items-center justify-center overflow-hidden rounded-xl min-h-24 max-h-56 bg-black/40 p-2">
      </div>
    </div>

  </div>

  <script>
    let selectedFile = null;

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      selectedFile = file;
      document.getElementById('fileLabel').innerText = file.name;
      document.getElementById('fileSizeLabel').innerText = (file.size / (1024 * 1024)).toFixed(2) + " MB";
      document.getElementById('resultBox').classList.add('hidden');
    }

    // ড্র্যাগ অ্যান্ড ড্রপ লজিক
    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-cyan-400'); });
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('border-cyan-400'); });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-cyan-400');
      if (e.dataTransfer.files.length) {
        document.getElementById('fileInput').files = e.dataTransfer.files;
        handleFileSelect({ target: { files: e.dataTransfer.files } });
      }
    });

    // আসল এবং নিখুঁত আপলোড ফাংশন
    function uploadToCatbox() {
      if (!selectedFile) {
        alert("Please select a file first!");
        return;
      }

      // Vercel ফ্রি প্ল্যানে ৪.৫ MB-এর বেশি ফাইল আপলোড ব্লক হয়ে যায়
      if (selectedFile.size > 4.5 * 1024 * 1024) {
        alert("File size exceeds 4.5 MB limit for Vercel!");
        return;
      }

      const uploadBtn = document.getElementById('uploadBtn');
      const progressBox = document.getElementById('progressBox');
      const progressBar = document.getElementById('progressBar');
      const uploadPercent = document.getElementById('uploadPercent');
      const uploadStatus = document.getElementById('uploadStatus');
      const userHash = document.getElementById('userHash').value.trim();

      uploadBtn.disabled = true;
      uploadBtn.classList.add('opacity-50');
      progressBox.classList.remove('hidden');
      progressBar.style.width = '0%';
      uploadPercent.innerText = '0%';
      uploadStatus.innerText = 'Uploading...';

      const formData = new FormData();
      formData.append('reqtype', 'fileupload');
      if (userHash) {
        formData.append('userhash', userHash);
      }
      formData.append('fileToUpload', selectedFile);

      // XMLHttpRequest দিয়ে আসল ০% থেকে ১০০% প্রগ্রেস ট্র্যাকিং
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/catbox');

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const percent = Math.round((e.loaded / e.total) * 100);
          progressBar.style.width = percent + '%';
          uploadPercent.innerText = percent + '%';
          if (percent === 100) {
            uploadStatus.innerText = 'Processing link...';
          }
        }
      };

      xhr.onload = async () => {
        uploadBtn.disabled = false;
        uploadBtn.classList.remove('opacity-50');
        setTimeout(() => progressBox.classList.add('hidden'), 800);

        if (xhr.status >= 200 && xhr.status < 300) {
          const catboxUrl = xhr.responseText.trim();
          if (catboxUrl.startsWith('http')) {
            await showResult(catboxUrl);
          } else {
            alert("Catbox response: " + catboxUrl);
          }
        } else {
          alert(`Upload Failed (${xhr.status}): ${xhr.responseText || 'Check if api/catbox.js is deployed'}`);
        }
      };

      xhr.onerror = () => {
        uploadBtn.disabled = false;
        uploadBtn.classList.remove('opacity-50');
        progressBox.classList.add('hidden');
        alert("Connection failed! Make sure api/catbox.js file exists on your server.");
      };

      xhr.send(formData);
    }

    // নিখুঁত প্রিভিউ ফাংশন (Images, Videos, Telegram .tgs)
    async function showResult(url) {
      const resultBox = document.getElementById('resultBox');
      const resultUrl = document.getElementById('resultUrl');
      const previewArea = document.getElementById('previewArea');

      resultBox.classList.remove('hidden');
      resultUrl.value = url;
      previewArea.innerHTML = '';

      const ext = url.split('.').pop().toLowerCase();

      // ১. ছবি প্রিভিউ
      if (['jpeg', 'jpg', 'png', 'gif', 'webp', 'svg'].includes(ext)) {
        previewArea.innerHTML = `<img src="${url}" class="max-h-48 object-contain rounded-lg shadow" alt="Preview" />`;
      }
      // ২. ভিডিও প্রিভিউ
      else if (['webm', 'mp4', 'mov'].includes(ext)) {
        previewArea.innerHTML = `
          <video controls autoplay loop muted playsinline class="max-h-48 rounded-lg shadow">
            <source src="${url}" type="video/${ext === 'mov' ? 'mp4' : ext}">
          </video>`;
      }
      // ৩. টেলিগ্রাম অ্যানিমেটেড স্টিকার (.tgs) প্রিভিউ
      else if (ext === 'tgs') {
        previewArea.innerHTML = `<div id="tgsContainer" style="width: 140px; height: 140px;"></div>`;
        try {
          const arrayBuffer = await selectedFile.arrayBuffer();
          // আধুনিক Pako 2.x এবং TextDecoder এর সঠিক নিয়ম
          const decompressed = pako.inflate(new Uint8Array(arrayBuffer));
          const jsonString = new TextDecoder("utf-8").decode(decompressed);
          const animationData = JSON.parse(jsonString);

          lottie.loadAnimation({
            container: document.getElementById('tgsContainer'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            animationData: animationData
          });
        } catch (e) {
          console.error("TGS Parse Error:", e);
          previewArea.innerHTML = `<span class="text-xs text-emerald-400 font-mono">✅ Telegram Sticker uploaded!</span>`;
        }
      }
      // ৪. অডিও
      else if (['mp3', 'wav', 'ogg'].includes(ext)) {
        previewArea.innerHTML = `<audio controls class="w-full my-2"><source src="${url}"></audio>`;
      }
      // ৫. অন্যান্য ফাইল
      else {
        previewArea.innerHTML = `<a href="${url}" target="_blank" class="text-xs text-cyan-400 underline font-mono p-2">Click to open/download file ↗</a>`;
      }
    }

    // লিংক কপি করার ফাংশন
    function copyLink() {
      const urlInput = document.getElementById('resultUrl');
      urlInput.select();
      navigator.clipboard.writeText(urlInput.value);

      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = "Copied! ✅";
      setTimeout(() => { copyBtn.innerText = "Copy Link"; }, 2000);
    }
  </script>
</body>
</html>
