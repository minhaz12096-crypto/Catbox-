<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Bot Mini App Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 15px; display: flex; justify-content: center; }
        .card { background: #1e293b; width: 100%; max-width: 500px; padding: 20px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h3 { text-align: center; color: #38bdf8; margin-bottom: 15px; font-size: 20px; }
        .input-box, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 12px; outline: none; }
        .input-box:focus, textarea:focus { border-color: #38bdf8; }
        
        .token-group { display: flex; gap: 8px; margin-bottom: 12px; }
        .btn-refresh { background: #10b981; color: white; border: none; padding: 0 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .bot-status { background: #334155; padding: 8px 12px; border-radius: 8px; font-size: 13px; text-align: center; margin-bottom: 15px; color: #cbd5e1; }
        
        .checkbox-container { display: flex; gap: 12px; background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #334155; flex-wrap: wrap; }
        label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; user-select: none; }
        input[type="checkbox"], input[type="radio"] { accent-color: #38bdf8; width: 16px; height: 16px; }

        .btn-config { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px dashed #475569; margin-bottom: 15px; display: none; }
        .color-row { display: flex; gap: 10px; margin-top: 8px; font-size: 13px; flex-wrap: wrap; }

        .btn-submit { width: 100%; background: #0284c7; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: #0369a1; }
        
        .log-box { margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 13px; max-height: 140px; overflow-y: auto; background: #0f172a; display: none; border: 1px solid #334155; }
        .success { color: #4ade80; }
        .fail { color: #f87171; }
    </style>
</head>
<body>

<div class="card">
    <h3>🚀 Telegram Broadcast Panel</h3>
    
    <!-- Bot Status -->
    <div class="bot-status" id="botStatus">বট চেক করা হয়নি (টোকেন দিন)</div>

    <!-- Token Input & Refresh -->
    <div class="token-group">
        <input type="text" id="botToken" class="input-box" style="margin-bottom:0;" placeholder="Bot Token দিন...">
        <button class="btn-refresh" onclick="checkBotToken()">🔄 Refresh</button>
    </div>

    <!-- User / Target IDs -->
    <label style="font-size: 12px; color: #94a3b8; margin-bottom: 4px;">User IDs (একবার লিখলে ব্রাউজারে সেভ থাকবে):</label>
    <textarea id="targetIds" rows="2" placeholder="123456789&#10;987654321&#10;@channel_username"></textarea>

    <!-- Message Input -->
    <label style="font-size: 12px; color: #94a3b8; margin-bottom: 4px;">আপনার মেসেজ (কোনো কোড লেখার দরকার নেই):</label>
    <textarea id="msgText" rows="4" placeholder="এখানে যা লিখবেন হুবহু তাই যাবে..."></textarea>

    <!-- Style Checkboxes (টিক মার্ক অপশন) -->
    <div class="checkbox-container">
        <label><input type="checkbox" id="boldCheck"> <b>Bold (বোল্ড)</b></label>
        <label><input type="checkbox" id="italicCheck"> <i>Italic (ইটালিক)</i></label>
        <label><input type="checkbox" id="pinCheck"> 📌 Pin Message</label>
    </div>

    <!-- Inline Button Checkbox -->
    <label style="margin-bottom: 10px;"><input type="checkbox" id="btnToggle" onchange="toggleButtonBox()"> 🔘 ইনলাইন বাটন যোগ করুন</label>

    <!-- Button Settings Box -->
    <div class="btn-config" id="btnConfig">
        <input type="text" id="btnText" class="input-box" placeholder="বাটনের নাম (যেমন: Join Channel)">
        <input type="text" id="btnUrl" class="input-box" placeholder="বাটনের লিংক (https://t.me/...)">
        
        <span style="font-size: 13px; color: #94a3b8;">বাটন কালার সিলেক্ট করুন:</span>
        <div class="color-row">
            <label><input type="radio" name="btnColor" value="" checked> Default</label>
            <label style="color:#38bdf8;"><input type="radio" name="btnColor" value="primary"> 🔵 Blue</label>
            <label style="color:#4ade80;"><input type="radio" name="btnColor" value="success"> 🟢 Green</label>
            <label style="color:#f87171;"><input type="radio" name="btnColor" value="danger"> 🔴 Red</label>
        </div>
    </div>

    <!-- Submit Button -->
    <button class="btn-submit" id="submitBtn" onclick="sendBroadcast()">📢 Send to Users (মেসেজ পাঠান)</button>

    <!-- Logs -->
    <div class="log-box" id="logBox"></div>
</div>

<script>
    // নিরাপদ HTML রূপান্তর
    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    // অটো সেভ থেকে ডাটা লোড
    window.onload = function() {
        const savedToken = localStorage.getItem("tg_panel_token");
        const savedIds = localStorage.getItem("tg_panel_ids");
        if (savedToken) {
            document.getElementById("botToken").value = savedToken;
            checkBotToken();
        }
        if (savedIds) {
            document.getElementById("targetIds").value = savedIds;
        }
    };

    function toggleButtonBox() {
        document.getElementById("btnConfig").style.display = document.getElementById("btnToggle").checked ? "block" : "none";
    }

    // টোকেন রিফ্রেশ ও বট ইনফো চেক
    async function checkBotToken() {
        const token = document.getElementById("botToken").value.trim();
        const status = document.getElementById("botStatus");
        if (!token) return alert("বট টোকেন দিন!");

        status.innerText = "⏳ বট কানেক্ট হচ্ছে...";
        try {
            const res = await fetch(`https://api.telegram.org/bot${token}/getMe`);
            const data = await res.json();
            if (data.ok) {
                localStorage.setItem("tg_panel_token", token);
                status.innerText = `✅ কানেক্টেড: ${data.result.first_name} (@${data.result.username})`;
                status.style.color = "#4ade80";
            } else {
                status.innerText = `❌ ভুল টোকেন: ${data.description}`;
                status.style.color = "#f87171";
            }
        } catch (e) {
            status.innerText = "❌ ইন্টারনেট বা কানেকশন সমস্যা";
            status.style.color = "#f87171";
        }
    }

    // মেসেজ ব্রডকাস্ট ইঞ্জিন
    async function sendBroadcast() {
        const token = document.getElementById("botToken").value.trim();
        const rawIds = document.getElementById("targetIds").value.trim();
        const rawMsg = document.getElementById("msgText").value.trim();
        
        const isBold = document.getElementById("boldCheck").checked;
        const isItalic = document.getElementById("italicCheck").checked;
        const isPin = document.getElementById("pinCheck").checked;
        
        const hasBtn = document.getElementById("btnToggle").checked;
        const btnText = document.getElementById("btnText").value.trim();
        const btnUrl = document.getElementById("btnUrl").value.trim();
        const btnColor = document.querySelector('input[name="btnColor"]:checked').value;

        const logBox = document.getElementById("logBox");
        const submitBtn = document.getElementById("submitBtn");

        if (!token) return alert("বট টোকেন দিন!");
        if (!rawIds) return alert("অন্তত ১টি User ID বা Channel দিন!");
        if (!rawMsg) return alert("মেসেজ টেক্সট লিখুন!");

        localStorage.setItem("tg_panel_ids", rawIds);

        // টিক মার্ক অনুযায়ী টেক্সট ফরম্যাট তৈরি (কখনোই ক্র্যাশ করবে না)
        let formattedText = escapeHtml(rawMsg);
        if (isBold) formattedText = `<b>${formattedText}</b>`;
        if (isItalic) formattedText = `<i>${formattedText}</i>`;

        // বাটন তৈরি
        let replyMarkup = undefined;
        if (hasBtn && btnText && btnUrl) {
            const btn = { text: btnText, url: btnUrl };
            if (btnColor) btn.style = btnColor;
            replyMarkup = { inline_keyboard: [[btn]] };
        }

        const ids = rawIds.split(/[\n,]+/).map(i => i.trim()).filter(i => i.length > 0);

        logBox.style.display = "block";
        logBox.innerHTML = `🚀 মোট ${ids.length} জনের কাছে পাঠানো হচ্ছে...<br>`;
        submitBtn.disabled = true;

        let success = 0, fail = 0;

        for (let i = 0; i < ids.length; i++) {
            const chatId = ids[i];
            const payload = {
                chat_id: chatId,
                text: formattedText,
                parse_mode: "HTML"
            };
            if (replyMarkup) payload.reply_markup = replyMarkup;

            try {
                const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.ok) {
                    success++;
                    logBox.innerHTML += `<span class="success">✅ Sent to ${chatId}</span><br>`;

                    // পিন অপশন অন থাকলে মেসেজ পিন করা
                    if (isPin && data.result && data.result.message_id) {
                        await fetch(`https://api.telegram.org/bot${token}/pinChatMessage`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                chat_id: chatId,
                                message_id: data.result.message_id
                            })
                        });
                    }
                } else {
                    fail++;
                    logBox.innerHTML += `<span class="fail">❌ ${chatId}: ${data.description}</span><br>`;
                }
            } catch (err) {
                fail++;
                logBox.innerHTML += `<span class="fail">❌ Error connecting for ${chatId}</span><br>`;
            }

            // ফ্লাড লিমিট এড়াতে বিরতি
            await new Promise(r => setTimeout(r, 60));
            logBox.scrollTop = logBox.scrollHeight;
        }

        logBox.innerHTML += `<br><b>🎉 শেষ হয়েছে! সফল: ${success}, ব্যর্থ: ${fail}</b>`;
        submitBtn.disabled = false;
    }
</script>

</body>
</html>
