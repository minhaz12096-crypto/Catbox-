<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Bot Broadcast & Pin Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            width: 100%;
            max-width: 600px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        input[type="text"]:focus, textarea:focus {
            border-color: #38bdf8;
        }
        textarea {
            resize: vertical;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            cursor: pointer;
            user-select: none;
            margin-bottom: 12px;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: #38bdf8;
            cursor: pointer;
        }
        .btn-config {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #475569;
            margin-bottom: 15px;
            display: none;
        }
        .color-options {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .color-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .color-primary { color: #38bdf8; }
        .color-success { color: #4ade80; }
        .color-danger { color: #f87171; }
        
        .send-btn {
            width: 100%;
            background: #0284c7;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .send-btn:hover {
            background: #0369a1;
        }
        .status-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            line-height: 1.5;
            max-height: 150px;
            overflow-y: auto;
        }
        .log-success { color: #4ade80; }
        .log-error { color: #f87171; }
        .tag-hint {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Telegram Broadcast & Pin Panel</h2>

    <!-- Bot Token -->
    <div class="form-group">
        <label>🤖 Bot Token:</label>
        <input type="text" id="botToken" placeholder="123456789:AAFx...">
    </div>

    <!-- User IDs -->
    <div class="form-group">
        <label>👥 Target User / Channel IDs (প্রতি লাইনে ১টি করে আইডি বা কমা দিয়ে দিন):</label>
        <textarea id="targetIds" rows="3" placeholder="1234567890&#10;987654321&#10;@channel_username"></textarea>
    </div>

    <!-- Message Text (HTML) -->
    <div class="form-group">
        <label>📝 Message Text (HTML Format Support):</label>
        <textarea id="messageText" rows="4" placeholder="<b>Bold</b>, <i>Italic</i>, বা <a href='https://link.com'>Link Text</a>"></textarea>
        <div class="tag-hint">সাপোর্টেড ট্যাগ: &lt;b&gt;, &lt;i&gt;, &lt;a href="..."&gt;, &lt;code&gt;</div>
    </div>

    <!-- Pin Message Checkbox -->
    <label class="checkbox-group">
        <input type="checkbox" id="pinMessageCheck">
        <span>📌 পিন মেসেজ (মেসেজ যাওয়ার সাথে সাথে Pin হবে)</span>
    </label>

    <!-- Inline Button Checkbox -->
    <label class="checkbox-group">
        <input type="checkbox" id="inlineBtnCheck" onchange="toggleButtonConfig()">
        <span>🔘 ইনলাইন বাটন যোগ করুন (Inline Button)</span>
    </label>

    <!-- Inline Button Settings Box -->
    <div class="btn-config" id="btnConfigBox">
        <div class="form-group">
            <label>বাটন টেক্সট (Button Text):</label>
            <input type="text" id="btnText" placeholder="যেমন: Visit Channel">
        </div>
        <div class="form-group">
            <label>বাটন লিংক (Button URL):</label>
            <input type="text" id="btnUrl" placeholder="https://t.me/...">
        </div>
        <label>বাটন কালার সিলেক্ট করুন (টিক না দিলে সাধারণ ডিফল্ট হবে):</label>
        <div class="color-options">
            <label class="color-label">
                <input type="radio" name="btnColor" value="" checked>
                <span>ডিফল্ট (কোনো কালার না)</span>
            </label>
            <label class="color-label color-primary">
                <input type="radio" name="btnColor" value="primary">
                <span>🔵 Primary (নীল)</span>
            </label>
            <label class="color-label color-success">
                <input type="radio" name="btnColor" value="success">
                <span>🟢 Success (সবুজ)</span>
            </label>
            <label class="color-label color-danger">
                <input type="radio" name="btnColor" value="danger">
                <span>🔴 Danger (লাল)</span>
            </label>
        </div>
    </div>

    <!-- Send Button -->
    <button class="send-btn" id="sendBtn" onclick="startBroadcast()">🚀 Send & Broadcast</button>

    <!-- Status Box -->
    <div class="status-box" id="statusBox"></div>
</div>

<script>
    // LocalStorage থেকে টোকেন সেভ রাখা
    document.addEventListener("DOMContentLoaded", () => {
        const savedToken = localStorage.getItem("tg_bot_token");
        if (savedToken) document.getElementById("botToken").value = savedToken;
    });

    function toggleButtonConfig() {
        const isChecked = document.getElementById("inlineBtnCheck").checked;
        document.getElementById("btnConfigBox").style.display = isChecked ? "block" : "none";
    }

    async function startBroadcast() {
        const token = document.getElementById("botToken").value.trim();
        const idsRaw = document.getElementById("targetIds").value.trim();
        const text = document.getElementById("messageText").value.trim();
        const isPin = document.getElementById("pinMessageCheck").checked;
        const hasBtn = document.getElementById("inlineBtnCheck").checked;
        const btnText = document.getElementById("btnText").value.trim();
        const btnUrl = document.getElementById("btnUrl").value.trim();
        const selectedColor = document.querySelector('input[name="btnColor"]:checked').value;
        const statusBox = document.getElementById("statusBox");
        const sendBtn = document.getElementById("sendBtn");

        if (!token) return alert("দয়া করে Bot Token দিন!");
        if (!idsRaw) return alert("দয়া করে অন্তত ১টি User ID বা Channel দিন!");
        if (!text) return alert("মেসেজ টেক্সট খালি রাখা যাবে না!");

        localStorage.setItem("tg_bot_token", token);

        const ids = idsRaw.split(/[\n,]+/).map(id => id.trim()).filter(id => id.length > 0);

        statusBox.style.display = "block";
        statusBox.style.background = "#0f172a";
        statusBox.innerHTML = `⏳ ব্রডকাস্ট শুরু হচ্ছে... মোট টার্গেট: ${ids.length} জন<br>`;
        sendBtn.disabled = true;

        let successCount = 0;
        let failCount = 0;

        for (let i = 0; i < ids.length; i++) {
            const chatId = ids[i];

            // মেসেজ পেলোড তৈরি
            const payload = {
                chat_id: chatId,
                text: text,
                parse_mode: "HTML"
            };

            // বাটন থাকলে বাটন যোগ করা
            if (hasBtn && btnText && btnUrl) {
                const btnObj = { text: btnText, url: btnUrl };
                if (selectedColor) {
                    btnObj.style = selectedColor; // primary / success / danger
                }
                payload.reply_markup = {
                    inline_keyboard: [[btnObj]]
                };
            }

            try {
                // ১. মেসেজ পাঠানো
                const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const resData = await response.json();

                if (resData.ok) {
                    successCount++;
                    statusBox.innerHTML += `<span class="log-success">✅ [${i+1}/${ids.length}] Sent to ${chatId}</span><br>`;

                    // ২. পিন অপশন অন থাকলে মেসেজ পিন করা
                    if (isPin && resData.result && resData.result.message_id) {
                        await fetch(`https://api.telegram.org/bot${token}/pinChatMessage`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                chat_id: chatId,
                                message_id: resData.result.message_id
                            })
                        });
                    }
                } else {
                    failCount++;
                    statusBox.innerHTML += `<span class="log-error">❌ [${i+1}/${ids.length}] Failed to ${chatId}: ${resData.description}</span><br>`;
                }
            } catch (err) {
                failCount++;
                statusBox.innerHTML += `<span class="log-error">❌ Network Error for ${chatId}</span><br>`;
            }

            // টেলিগ্রাম ফ্লাড লিমিট এড়াতে প্রতি মেসেজের মাঝে সামান্য বিরতি
            await new Promise(r => setTimeout(r, 80));
            statusBox.scrollTop = statusBox.scrollHeight;
        }

        statusBox.innerHTML += `<br><b>🎉 সম্পন্ন হয়েছে! সফল: ${successCount}, ব্যর্থ: ${failCount}</b>`;
        sendBtn.disabled = false;
    }
</script>

</body>
</html>
